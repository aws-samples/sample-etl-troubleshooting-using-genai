  # ---------------------------------------------------------------------------
  # Lambda role for the Glue aggregation script uploader
  # ---------------------------------------------------------------------------
  GlueAggScriptUploaderRole:
    Type: AWS::IAM::Role
    Metadata:
      Description: "IAM role for the Lambda that uploads Glue aggregation scripts"
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: GlueAggScriptUploaderS3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                Resource:
                  - !Sub 'arn:aws:s3:::${ETLDataBucket}/glue-scripts/*'

  # ---------------------------------------------------------------------------
  # Lambda — uploads glue_agg_job.py to S3
  # ---------------------------------------------------------------------------
  GlueAggScriptUploaderFunction:
    Type: AWS::Lambda::Function
    Metadata:
      Description: "Lambda function that uploads the Glue aggregation script to S3"
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt GlueAggScriptUploaderRole.Arn
      Timeout: !Ref LambdaTimeout
      Environment:
        Variables:
          SOURCE_BUCKET: !Ref ETLDataBucket
      Code:
        ZipFile: |
          import os
          import boto3
          import cfnresponse

          GLUE_SCRIPT_KEY = "glue-scripts/glue_agg_job.py"

          GLUE_AGG_SCRIPT = r'''
          """
          AWS Glue Aggregation Job — triggered by MWAA Serverless.

          Reads the same XLSX sales data, computes aggregations
          (revenue/profit by category, by region, by channel), and writes
          the summary as JSON to S3 at output/agg/.
          """

          from __future__ import annotations

          import json
          import logging
          import os
          import sys
          import traceback
          from collections import defaultdict
          from io import BytesIO

          import boto3
          import botocore.exceptions
          import openpyxl

          logger = logging.getLogger(__name__)
          logger.setLevel(logging.INFO)

          def _parse_args_glue(arg_names):
              from awsglue.utils import getResolvedOptions
              return getResolvedOptions(sys.argv, arg_names)

          def _parse_args_cli(arg_names):
              args = {}
              argv = sys.argv[1:]
              i = 0
              while i < len(argv):
                  token = argv[i]
                  if token.startswith("--"):
                      key = token[2:]
                      if key in arg_names:
                          if i + 1 < len(argv) and not argv[i + 1].startswith("--"):
                              args[key] = argv[i + 1]
                              i += 2
                              continue
                  i += 1
              missing = [n for n in arg_names if n not in args]
              if missing:
                  raise ValueError(f"Missing required arguments: {missing}")
              return args

          def get_job_args(arg_names):
              try:
                  return _parse_args_glue(arg_names)
              except (ImportError, ModuleNotFoundError):
                  return _parse_args_cli(arg_names)

          def aggregate_records(headers, data_rows):
              col_idx = {h: i for i, h in enumerate(headers)}
              required = ["Category", "Region", "Channel", "Revenue", "Profit"]
              for col in required:
                  if col not in col_idx:
                      raise ValueError(f"Required column '{col}' not found. Headers: {headers}")

              by_category = defaultdict(lambda: {"revenue": 0.0, "profit": 0.0, "count": 0})
              by_region = defaultdict(lambda: {"revenue": 0.0, "profit": 0.0, "count": 0})
              by_channel = defaultdict(lambda: {"revenue": 0.0, "profit": 0.0, "count": 0})

              for row in data_rows:
                  category = row[col_idx["Category"]]
                  region = row[col_idx["Region"]]
                  channel = row[col_idx["Channel"]]
                  revenue = float(row[col_idx["Revenue"]] or 0)
                  profit = float(row[col_idx["Profit"]] or 0)

                  by_category[category]["revenue"] += revenue
                  by_category[category]["profit"] += profit
                  by_category[category]["count"] += 1

                  by_region[region]["revenue"] += revenue
                  by_region[region]["profit"] += profit
                  by_region[region]["count"] += 1

                  by_channel[channel]["revenue"] += revenue
                  by_channel[channel]["profit"] += profit
                  by_channel[channel]["count"] += 1

              return {
                  "by_category": dict(by_category),
                  "by_region": dict(by_region),
                  "by_channel": dict(by_channel),
                  "total_records": len(data_rows),
              }

          def run_aggregation(source_bucket, xlsx_key, output_prefix):
              s3 = boto3.client("s3")

              logger.info(json.dumps({
                  "status": "downloading",
                  "source_bucket": source_bucket,
                  "xlsx_key": xlsx_key,
              }))
              response = s3.get_object(Bucket=source_bucket, Key=xlsx_key)
              xlsx_bytes = response["Body"].read()

              wb = openpyxl.load_workbook(BytesIO(xlsx_bytes), read_only=True, data_only=True)
              ws = wb.active
              rows_iter = ws.iter_rows(values_only=True)
              header_row = next(rows_iter, None)
              if header_row is None:
                  raise ValueError("XLSX workbook is empty.")
              headers = [str(cell) if cell is not None else "" for cell in header_row]
              data_rows = list(rows_iter)

              logger.info(json.dumps({
                  "status": "aggregating",
                  "row_count": len(data_rows),
              }))

              summary = aggregate_records(headers, data_rows)

              xlsx_filename = os.path.basename(xlsx_key)
              base_name = os.path.splitext(xlsx_filename)[0]
              prefix = output_prefix.rstrip("/") + "/" if output_prefix else ""
              output_key = f"{prefix}{base_name}_summary.json"

              output_body = json.dumps(summary, default=str, indent=2).encode("utf-8")
              s3.put_object(
                  Bucket=source_bucket,
                  Key=output_key,
                  Body=output_body,
                  ContentType="application/json",
              )

              logger.info(json.dumps({
                  "status": "success",
                  "aggregation_output_key": output_key,
                  "total_records_processed": summary["total_records"],
                  "categories": len(summary["by_category"]),
                  "regions": len(summary["by_region"]),
                  "channels": len(summary["by_channel"]),
              }))

          if __name__ == "__main__":
              logging.basicConfig(
                  stream=sys.stdout,
                  level=logging.INFO,
                  format="%(asctime)s %(levelname)s %(name)s %(message)s",
              )
              _ARG_NAMES = ["source_bucket", "xlsx_key", "output_prefix"]
              _args = get_job_args(_ARG_NAMES)
              run_aggregation(
                  source_bucket=_args["source_bucket"],
                  xlsx_key=_args["xlsx_key"],
                  output_prefix=_args["output_prefix"],
              )
          '''

          def handler(event, context):
              bucket = os.environ["SOURCE_BUCKET"]
              request_type = event.get("RequestType", "")
              try:
                  s3 = boto3.client("s3")
                  if request_type in ("Create", "Update"):
                      s3.put_object(
                          Bucket=bucket,
                          Key=GLUE_SCRIPT_KEY,
                          Body=GLUE_AGG_SCRIPT.encode("utf-8"),
                          ContentType="text/x-python",
                      )
                  elif request_type == "Delete":
                      try:
                          s3.delete_object(Bucket=bucket, Key=GLUE_SCRIPT_KEY)
                      except Exception:
                          pass
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
              except Exception as exc:
                  cfnresponse.send(
                      event, context, cfnresponse.FAILED,
                      {"Reason": str(exc)},
                  )

  # ---------------------------------------------------------------------------
  # Custom resource — uploads the aggregation Glue script
  # ---------------------------------------------------------------------------
  GlueAggScriptUploaderResource:
    Type: AWS::CloudFormation::CustomResource
    Metadata:
      Description: "Custom resource triggering Glue aggregation script upload"
    Properties:
      ServiceToken: !GetAtt GlueAggScriptUploaderFunction.Arn
      SourceBucket: !Ref ETLDataBucket

  # ---------------------------------------------------------------------------
  # Glue Aggregation Job
  # ---------------------------------------------------------------------------
  ObservabilityBlogAggJob:
    Type: AWS::Glue::Job
    Metadata:
      Description: "AWS Glue job that computes revenue and profit aggregations"
    DependsOn: GlueAggScriptUploaderResource
    Properties:
      Name: ObservabilityBlogAggregation
      Role: !GetAtt GlueAggJobRole.Arn
      Command:
        Name: glueetl
        ScriptLocation: !Sub 's3://${ETLDataBucket}/glue-scripts/glue_agg_job.py'
        PythonVersion: '3'
      GlueVersion: '4.0'
      WorkerType: G.1X
      NumberOfWorkers: 2
      DefaultArguments:
        '--source_bucket': !Ref ETLDataBucket
        '--xlsx_key': 'data/blog_sales_data.xlsx'
        '--output_prefix': 'output/agg/'
        '--extra-py-files': !Sub 's3://${ETLDataBucket}/glue-libs/openpyxl.zip'
        '--job-language': 'python'

  # ---------------------------------------------------------------------------
  # MWAA Serverless Execution Role
  # ---------------------------------------------------------------------------
  MWAAServerlessExecutionRole:
    Type: AWS::IAM::Role
    Metadata:
      Description: "IAM execution role for the MWAA Serverless workflow"
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: airflow-serverless.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: MWAAServerlessPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - glue:StartJobRun
                  - glue:GetJobRun
                  - glue:GetJobRuns
                  - glue:GetJob
                  - glue:BatchStopJobRun
                Resource:
                  - !Sub 'arn:aws:glue:${AWS::Region}:${AWS::AccountId}:job/ObservabilityBlogAggregation'
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt GlueAggJobRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: glue.amazonaws.com
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:GetLogEvents
                  - logs:DescribeLogGroups
                Resource:
                  - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/mwaa-serverless/*'
                  - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/mwaa-serverless/*:*'

  # ---------------------------------------------------------------------------
  # MWAA Serverless Workflow YAML Uploader Lambda Role
  # ---------------------------------------------------------------------------
  MWAAServerlessYAMLUploaderRole:
    Type: AWS::IAM::Role
    Metadata:
      Description: "IAM role for the Lambda that uploads MWAA Serverless workflow YAML"
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: MWAAServerlessYAMLUploaderS3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub 'arn:aws:s3:::${ETLDataBucket}/mwaa-serverless/*'

  # ---------------------------------------------------------------------------
  # Lambda — uploads the MWAA Serverless workflow YAML to S3
  # ---------------------------------------------------------------------------
  MWAAServerlessYAMLUploaderFunction:
    Type: AWS::Lambda::Function
    Metadata:
      Description: "Lambda function that uploads the MWAA Serverless workflow definition"
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt MWAAServerlessYAMLUploaderRole.Arn
      Timeout: !Ref LambdaTimeout
      Environment:
        Variables:
          SOURCE_BUCKET: !Ref ETLDataBucket
          XLSX_KEY: data/blog_sales_data.xlsx
      Code:
        ZipFile: |
          import os
          import boto3
          import cfnresponse

          WORKFLOW_YAML = """observability_blog_aggregation:
            dag_id: observability_blog_aggregation
            schedule: null
            tasks:
              run_aggregation_job:
                operator: airflow.providers.amazon.aws.operators.glue.GlueJobOperator
                job_name: ObservabilityBlogAggregation
                script_args:
                  --source_bucket: "{source_bucket}"
                  --xlsx_key: "{xlsx_key}"
                  --output_prefix: "output/agg/"
                wait_for_completion: true
                task_id: run_aggregation_job
                dependencies: []
          """

          WORKFLOW_S3_KEY = "mwaa-serverless/aggregation_workflow.yaml"

          def handler(event, context):
              source_bucket = os.environ["SOURCE_BUCKET"]
              xlsx_key = os.environ["XLSX_KEY"]
              request_type = event.get("RequestType", "")

              try:
                  s3 = boto3.client("s3")
                  if request_type in ("Create", "Update"):
                      workflow_content = WORKFLOW_YAML.format(
                          source_bucket=source_bucket,
                          xlsx_key=xlsx_key,
                      )
                      s3.put_object(
                          Bucket=source_bucket,
                          Key=WORKFLOW_S3_KEY,
                          Body=workflow_content.encode("utf-8"),
                          ContentType="text/yaml",
                      )
                  elif request_type == "Delete":
                      try:
                          s3.delete_object(Bucket=source_bucket, Key=WORKFLOW_S3_KEY)
                      except Exception:
                          pass
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
              except Exception as exc:
                  cfnresponse.send(
                      event, context, cfnresponse.FAILED,
                      {"Reason": str(exc)},
                  )

  # ---------------------------------------------------------------------------
  # Custom resource — uploads the workflow YAML to S3
  # ---------------------------------------------------------------------------
  MWAAServerlessYAMLUploaderResource:
    Type: AWS::CloudFormation::CustomResource
    Metadata:
      Description: "Custom resource triggering the workflow YAML upload"
    Properties:
      ServiceToken: !GetAtt MWAAServerlessYAMLUploaderFunction.Arn
      SourceBucket: !Ref ETLDataBucket

  # ---------------------------------------------------------------------------
  # MWAA Serverless Workflow (native CFN resource)
  # ---------------------------------------------------------------------------
  MWAAServerlessWorkflow:
    Type: AWS::MWAAServerless::Workflow
    Metadata:
      Description: "MWAA Serverless workflow running the aggregation ETL pipeline"
    DependsOn:
      - ObservabilityBlogAggJob
      - MWAAServerlessYAMLUploaderResource
    Properties:
      Name: !Sub '${AWS::StackName}-serverless-agg'
      Description: 'Observability Blog — aggregation ETL via MWAA Serverless'
      DefinitionS3Location:
        Bucket: !Ref ETLDataBucket
        ObjectKey: mwaa-serverless/aggregation_workflow.yaml
      RoleArn: !GetAtt MWAAServerlessExecutionRole.Arn
      LoggingConfiguration:
        LogGroupName: !Sub '/aws/mwaa-serverless/${AWS::StackName}-serverless-agg'

  # ---------------------------------------------------------------------------
  # CloudWatch Log Group for MWAA Serverless workflow
  # ---------------------------------------------------------------------------
  MWAAServerlessLogGroup:
    Type: AWS::Logs::LogGroup
    Metadata:
      Description: "CloudWatch Logs group for MWAA Serverless workflow execution"
    Properties:
      LogGroupName: !Sub '/aws/mwaa-serverless/${AWS::StackName}-serverless-agg'
      RetentionInDays: 30

  GlueAggLogGroup:
    Type: AWS::Logs::LogGroup
    Metadata:
      Description: "CloudWatch Logs group for the Glue aggregation job"
    Properties:
      LogGroupName: /aws-glue/jobs/ObservabilityBlogAggregation
      RetentionInDays: 30

Outputs:
  GlueJobName:
    Description: Name of the Glue ETL job
    Value: !Ref ObservabilityBlogETLJob
    Export:
      Name: !Sub '${AWS::StackName}-GlueJobName'

  EC2InstanceId:
    Description: EC2 instance ID running the Python ETL script
    Value: !Ref EC2Instance
    Export:
      Name: !Sub '${AWS::StackName}-EC2InstanceId'

  MWAAEnvironmentName:
    Description: MWAA environment name
    Value: !Ref MWAAEnvironment
    Export:
      Name: !Sub '${AWS::StackName}-MWAAEnvironmentName'

  ETLDataBucketName:
    Description: S3 bucket name for ETL data and log DLQ
    Value: !Ref ETLDataBucket
    Export:
      Name: !Sub '${AWS::StackName}-ETLDataBucketName'

  MWAADagsBucketName:
    Description: S3 bucket name for MWAA DAG files
    Value: !Ref MWAADagsBucket
    Export:
      Name: !Sub '${AWS::StackName}-MWAADagsBucketName'

  MWAAServerlessWorkflowArn:
    Description: MWAA Serverless workflow ARN for the aggregation pipeline
    Value: !GetAtt MWAAServerlessWorkflow.WorkflowArn
    Export:
      Name: !Sub '${AWS::StackName}-MWAAServerlessWorkflowArn'

  GlueAggJobName:
    Description: Name of the Glue Aggregation job (triggered by MWAA Serverless)
    Value: !Ref ObservabilityBlogAggJob
    Export:
      Name: !Sub '${AWS::StackName}-GlueAggJobName'
