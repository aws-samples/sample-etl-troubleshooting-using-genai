AWSTemplateFormatVersion: '2010-09-09'
Description: 'CloudFormation template for AgentCore MCP Server with optional Cognito authentication'

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "Required Parameters"
        Parameters:
          - MultimodalStackName
          - AgentCoreMCPServerName
          - AmazonOpenSearchEndpoint
          - AmazonOpenSearchRegion
      - Label:
          default: "Optional Parameters"
        Parameters:
          - ExecutionRole
          - ECRRepository
          - OAuthDiscoveryURL
          - OAuthAllowedClients
          - OAuthAllowedAudience
    ParameterLabels:
      MultimodalStackName:
        default: "OpenSearch Stack Name"
      AmazonOpenSearchEndpoint:
        default: "Amazon OpenSearch Endpoint"
      AmazonOpenSearchRegion:
        default: "OpenSearch Region"
      AgentCoreMCPServerName:
        default: "MCP Server Name"
      ExecutionRole:
        default: "Execution Role ARN (Optional)"
      ECRRepository:
        default: "ECR Repository URI (Optional)"
      OAuthDiscoveryURL:
        default: "OAuth Discovery URL (Optional)"
      OAuthAllowedClients:
        default: "Allowed Client IDs (Optional)"
      OAuthAllowedAudience:
        default: "Allowed Audiences (Optional)"

Parameters:
  MultimodalStackName:
    Type: String
    Description: Name of the OpenSearch CloudFormation stack that contains the OpenSearch domain
    Default: opensearch-cfn
    
  AgentCoreMCPServerName:
    Type: String
    Description: Name of the MCP server. The final AgentCore Runtime name will have a unique ID appended to this name. Maximum 35 characters.
    Default: opensearch_mcp_server
    AllowedPattern: "[a-zA-Z][a-zA-Z0-9_]{0,34}"
    ConstraintDescription: "Must start with a letter and contain only letters, numbers, and underscores. Maximum 35 characters."
  
  AmazonOpenSearchEndpoint:
    Type: String
    Description: "The endpoint of the Amazon OpenSearch Service. Leave blank to auto-import from multimodal stack."
    Default: ""

  AmazonOpenSearchRegion:
    Type: String
    Description: "AWS region where the OpenSearch cluster is located. Leave blank to auto-import from multimodal stack."
    Default: ""

  ExecutionRole:
    Type: String
    Description: Bedrock AgentCore execution role ARN. If left blank, a new role with the necessary permissions will be created. You will need to map the created role to a backend role of the OpenSearch domain.
    Default: ''
  
  ECRRepository:
    Type: String
    Description: ECR repository URI where the container image of the MCP server will be stored. If left blank, a new ECR repository will be created.
    Default: ''
  
  OAuthDiscoveryURL:
    Type: String
    Description: "OAuth2 discovery URL. Example: https://example.us-east-1.amazonaws.com/example/.well-known/openid-configuration. If left blank, a new Cognito user pool will be created."
    Default: ''
  
  OAuthAllowedClients:
    Type: CommaDelimitedList
    Description: Comma-separated list of allowed client IDs.
    Default: ''
  
  OAuthAllowedAudience:
    Type: CommaDelimitedList
    Description: Comma-separated list of allowed audiences.
    Default: ''

Conditions:
  CreateCognito: !And
    - !Equals [!Ref OAuthDiscoveryURL, '']
    - !Equals [!Join ['', !Ref OAuthAllowedClients], '']
    - !Equals [!Join ['', !Ref OAuthAllowedAudience], '']
  CreateECRRepository: !Equals [!Ref ECRRepository, '']
  CreateExecutionRole: !Equals [!Ref ExecutionRole, '']
  UseImportedOpenSearchEndpoint: !Equals [!Ref AmazonOpenSearchEndpoint, '']
  UseImportedOpenSearchRegion: !Equals [!Ref AmazonOpenSearchRegion, '']

Resources:
  LogsResourcePolicy:
    Type: AWS::Logs::ResourcePolicy
    Properties:
      PolicyName: TransactionSearchAccess
      PolicyDocument: !Sub >
        {
          "Version": "2012-10-17",		 	 	 
          "Statement": [
            {
              "Sid": "TransactionSearchXRayAccess",
              "Effect": "Allow",
              "Principal": {
                "Service": "xray.amazonaws.com"
              },
              "Action": [
                "logs:PutLogEvents",
                "logs:CreateLogStream"
              ],
              "Resource": [
                "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:aws/spans:*",
                "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/application-signals/data:*"
              ],
              "Condition": {
                "ArnLike": {
                  "aws:SourceArn": "arn:${AWS::Partition}:xray:${AWS::Region}:${AWS::AccountId}:*"
                },
                "StringEquals": {
                  "aws:SourceAccount": "${AWS::AccountId}"
                }
              }
            },
            {
              "Sid": "TransactionSearchXRayAccessCloudTrail",
              "Effect": "Allow",
              "Principal": {
                "Service": "xray.amazonaws.com"
              },
              "Action": [
                "cloudtrail:*"
              ],
              "Resource": [
                "*"
              ],
              "Condition": {
                "ArnLike": {
                  "aws:SourceArn": "arn:${AWS::Partition}:xray:${AWS::Region}:${AWS::AccountId}:*"
                },
                "StringEquals": {
                  "aws:SourceAccount": "${AWS::AccountId}"
                }
              }
            }
          ]
        }

  XRayTransactionSearchConfig:
    Type: AWS::XRay::TransactionSearchConfig
    DependsOn: LogsResourcePolicy
    Properties:
      IndexingPercentage: 3
  
  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Condition: CreateCognito
    Properties:
      UserPoolName: !Sub 
        - '${AgentCoreMCPServerName}-user-pool-${StackId}'
        - StackId: !Select [4, !Split ['-', !Select [2, !Split ['/', !Ref 'AWS::StackId']]]]
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: false
          RequireLowercase: false
          RequireNumbers: false
          RequireSymbols: false

  CognitoUserPoolResourceServer:
    Type: AWS::Cognito::UserPoolResourceServer
    Condition: CreateCognito
    Properties:
      UserPoolId: !Ref CognitoUserPool
      Identifier: !Sub 
        - '${AgentCoreMCPServerName}_${StackId}'
        - StackId: !Select [4, !Split ['-', !Select [2, !Split ['/', !Ref 'AWS::StackId']]]]
      Name: !Sub 
        - '${AgentCoreMCPServerName} Resource Server ${StackId}'
        - StackId: !Select [4, !Split ['-', !Select [2, !Split ['/', !Ref 'AWS::StackId']]]]
      Scopes:
        - ScopeName: invoke
          ScopeDescription: Invoke MCP server

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Condition: CreateCognito
    DependsOn: CognitoUserPoolResourceServer
    Properties:
      UserPoolId: !Ref CognitoUserPool
      ClientName: !Sub 
        - '${AgentCoreMCPServerName}-client-${StackId}'
        - StackId: !Select [4, !Split ['-', !Select [2, !Split ['/', !Ref 'AWS::StackId']]]]
      GenerateSecret: true
      AllowedOAuthFlows:
        - client_credentials
      AllowedOAuthScopes:
        - !Sub 
          - '${AgentCoreMCPServerName}_${StackId}/invoke'
          - StackId: !Select [4, !Split ['-', !Select [2, !Split ['/', !Ref 'AWS::StackId']]]]
      AllowedOAuthFlowsUserPoolClient: true
      SupportedIdentityProviders:
        - COGNITO

  CognitoUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Condition: CreateCognito
    Properties:
      Domain: !Sub 
        - 'opensearch-mcp-${StackId}'
        - StackId: !Select [4, !Split ['-', !Select [2, !Split ['/', !Ref 'AWS::StackId']]]]
      UserPoolId: !Ref CognitoUserPool

  CognitoSecret:
    Type: AWS::SecretsManager::Secret
    Condition: CreateCognito
    Properties:
      Name: !Sub 
        - 'CognitoSecret-${AgentCoreMCPServerName}-${StackId}'
        - StackId: !Select [4, !Split ['-', !Select [2, !Split ['/', !Ref 'AWS::StackId']]]]
      Description: Cognito client ID and secret
      SecretString: !Sub 
        - '{ "clientId" : "${ClientId}", "clientSecret" : "${ClientSecret}" }'
        - ClientId: !Ref CognitoUserPoolClient
          ClientSecret: !GetAtt CognitoUserPoolClient.ClientSecret

  AgentECRRepository:
    Type: AWS::ECR::Repository
    Condition: CreateECRRepository
    Properties:
      RepositoryName: !Sub 
        - '${AgentCoreMCPServerName}-ecr-repo-${StackId}'
        - StackId: !Select [4, !Split ['-', !Select [2, !Split ['/', !Ref 'AWS::StackId']]]]
      EmptyOnDelete: true

  AgentExecutionRole:
    Type: AWS::IAM::Role
    Condition: CreateExecutionRole
    Properties:
      RoleName: !Sub 
        - '${AgentCoreMCPServerName}-execution-role-${StackId}'
        - StackId: !Select [4, !Split ['-', !Select [2, !Split ['/', !Ref 'AWS::StackId']]]]
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AssumeRolePolicy
            Effect: Allow
            Principal:
              Service: bedrock-agentcore.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                'aws:SourceAccount': !Ref 'AWS::AccountId'
              ArnLike:
                'aws:SourceArn': !Sub 'arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:*'
      Policies:
        - PolicyName: AgentCoreExecutionPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ECRImageAccess
                Effect: Allow
                Action:
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                Resource:
                  - !Sub 'arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/*'
              - Effect: Allow
                Action:
                  - logs:DescribeLogStreams
                  - logs:CreateLogGroup
                Resource:
                  - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/*'
              - Effect: Allow
                Action:
                  - logs:DescribeLogGroups
                Resource:
                  - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:*'
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/*:log-stream:*'
              - Sid: ECRTokenAccess
                Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                  - xray:GetSamplingRules
                  - xray:GetSamplingTargets
                Resource: '*'
              - Effect: Allow
                Resource: '*'
                Action: cloudwatch:PutMetricData
                Condition:
                  StringEquals:
                    'cloudwatch:namespace': bedrock-agentcore
              - Sid: GetAgentAccessToken
                Effect: Allow
                Action:
                  - bedrock-agentcore:GetWorkloadAccessToken
                  - bedrock-agentcore:GetWorkloadAccessTokenForJWT
                  - bedrock-agentcore:GetWorkloadAccessTokenForUserId
                Resource:
                  - !Sub 'arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/default'
                  - !Sub 
                    - 'arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/default/workload-identity/${AgentCoreMCPServerName}_${StackId}-*'
                    - StackId: !Select [4, !Split ['-', !Select [2, !Split ['/', !Ref 'AWS::StackId']]]]
              - Sid: BedrockModelInvocation
                Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  - !Sub 'arn:aws:bedrock:*::foundation-model/*'
                  - !Sub 'arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:*'
                  - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*"                  
                  - !Sub "arn:aws:bedrock:us-east-1::foundation-model/*"
                  - !Sub "arn:aws:bedrock:us-east-1:${AWS::AccountId}:inference-profile/*"                  
                  - !Sub "arn:aws:bedrock:us-east-2::foundation-model/*"
                  - !Sub "arn:aws:bedrock:us-east-2:${AWS::AccountId}:inference-profile/*"                  
                  - !Sub "arn:aws:bedrock:us-west-1::foundation-model/*"
                  - !Sub "arn:aws:bedrock:us-west-1:${AWS::AccountId}:inference-profile/*"    
        - PolicyName: AgentCoreMarketSubscription
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: MarketplaceOperationsFromBedrockFor3pModels
                Effect: Allow
                Action:
                  - aws-marketplace:Subscribe
                  - aws-marketplace:ViewSubscriptions
                  - aws-marketplace:Unsubscribe
                Resource: "*"
                Condition:
                  StringEquals:
                    'aws:CalledViaLast': 'bedrock.amazonaws.com'

  HelperLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 
        - '${AgentCoreMCPServerName}-helper-role-${StackId}'
        - StackId: !Select [4, !Split ['-', !Select [2, !Split ['/', !Ref 'AWS::StackId']]]]
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: HelperLambdaPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:PutObject
                  - s3:GetObject
                  - s3:ListBucket
                  - s3:DeleteObject
                  - s3:DeleteBucket
                Resource: '*'
              - Effect: Allow
                Action:
                  - iam:PassRole
                Resource: '*'
        - PolicyName: AgentCoreMarketSubscription
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: MarketplaceOperationsFromBedrockFor3pModels
                Effect: Allow
                Action:
                  - aws-marketplace:Subscribe
                  - aws-marketplace:ViewSubscriptions
                  - aws-marketplace:Unsubscribe
                Resource: "*"
                Condition:
                  StringEquals:
                    'aws:CalledViaLast': 'bedrock.amazonaws.com'

  CodeBuildServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 
        - '${AgentCoreMCPServerName}-codebuild-role-${StackId}'
        - StackId: !Select [4, !Split ['-', !Select [2, !Split ['/', !Ref 'AWS::StackId']]]]
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CloudWatchLogsPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/*'
        - PolicyName: BedrockAgentCorePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock-agentcore:*
                  - iam:PassRole
                  - iam:GetRole
                  - iam:CreateServiceLinkedRole
                Resource: '*'
        - PolicyName: S3Policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub 
                  - 'arn:aws:s3:::${S3Bucket}/*'
                  - S3Bucket: !Sub 
                    - 'agentcore-mcp-${AWS::AccountId}-${StackId}'
                    - StackId: !Select [4, !Split ['-', !Select [2, !Split ['/', !Ref 'AWS::StackId']]]]
        - PolicyName: ECRPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ecr:*
                Resource: !Sub 'arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/*'
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: '*'
        - PolicyName: AgentCoreMarketSubscription
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: MarketplaceOperationsFromBedrockFor3pModels
                Effect: Allow
                Action:
                  - aws-marketplace:Subscribe
                  - aws-marketplace:ViewSubscriptions
                  - aws-marketplace:Unsubscribe
                Resource: "*"
                Condition:
                  StringEquals:
                    'aws:CalledViaLast': 'bedrock.amazonaws.com'
        - PolicyName: AdditionalPermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sts:GetCallerIdentity
                  - sts:AssumeRole
                Resource: '*'
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:DescribeSecret
                Resource: '*'
              - Effect: Allow
                Action:
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackResources
                Resource: '*'

  AgentCoreLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 
        - '${AgentCoreMCPServerName}-lambda-role-${StackId}'
        - StackId: !Select [4, !Split ['-', !Select [2, !Split ['/', !Ref 'AWS::StackId']]]]
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: BedrockAgentCorePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock-agentcore:DeleteAgentRuntime
                  - iam:PassRole
                Resource: '*'
        - PolicyName: CodeBuildPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - codebuild:StartBuild
                  - codebuild:BatchGetBuilds
                Resource: !GetAtt CodeBuildProject.Arn
        - PolicyName: CloudWatchLogsPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:GetLogEvents
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/*'
        - PolicyName: AgentCoreMarketSubscription
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: MarketplaceOperationsFromBedrockFor3pModels
                Effect: Allow
                Action:
                  - aws-marketplace:Subscribe
                  - aws-marketplace:ViewSubscriptions
                  - aws-marketplace:Unsubscribe
                Resource: "*"
                Condition:
                  StringEquals:
                    'aws:CalledViaLast': 'bedrock.amazonaws.com'

  HelperLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 
        - '${AgentCoreMCPServerName}-helper-${StackId}'
        - StackId: !Select [4, !Split ['-', !Select [2, !Split ['/', !Ref 'AWS::StackId']]]]
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt HelperLambdaRole.Arn
      Timeout: 120
      Code:
        ZipFile: |
          import boto3
          import cfnresponse
          import urllib.request
          import json
          
          def lambda_handler(event, context):
              print("event: " + str(event))
              request_type = event['RequestType']
              
              if request_type == 'Update':
                  return respond_success(event, context)
              
              if request_type == 'Delete' or event['ResourceProperties'].get('CleanupS3Bucket') == 'true':
                  clean_s3_bucket(event['ResourceProperties']['S3Bucket'])
                  return respond_success(event, context)
              
              return download_and_upload_lambda(event, context)
          
          def download_and_upload_lambda(event, context):
              response_data = {'ContinuedInvoke': True}
              try:
                  source_url = event['ResourceProperties']['SourceUrl']
                  s3_key = event['ResourceProperties']['S3Key']
                  tmp_file_path = f"/tmp/{s3_key}"
                  
                  download_from_url(source_url, tmp_file_path)
                  bucket_name = event['ResourceProperties']['S3Bucket']
                  create_s3_bucket(bucket_name)
                  upload_file_to_s3(bucket_name, s3_key, tmp_file_path)
                  
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, response_data, context.log_stream_name)
                  return {"statusCode": 200}
              except Exception as e:
                  print(e)
                  response_data['ContinuedInvoke'] = False
                  cfnresponse.send(event, context, cfnresponse.FAILED, response_data, context.log_stream_name)
                  return {"statusCode": 500}
          
          def download_from_url(url, file_path):
              urllib.request.urlretrieve(url, file_path)
              print(f"Downloaded file from {url} to {file_path}")
          
          def create_s3_bucket(bucket_name):
              s3 = boto3.client('s3')
              region = boto3.session.Session().region_name
              if region == 'us-east-1':
                  s3.create_bucket(Bucket=bucket_name)
              else:
                  s3.create_bucket(Bucket=bucket_name, CreateBucketConfiguration={'LocationConstraint': region})
              print(f"S3 bucket {bucket_name} created successfully")
          
          def upload_file_to_s3(bucket_name, s3_key, file_path):
              s3 = boto3.resource('s3')
              s3.Bucket(bucket_name).upload_file(file_path, s3_key)
              print(f"Uploaded file to s3://{bucket_name}/{s3_key}")
          
          def respond_success(event, context):
              cfnresponse.send(event, context, cfnresponse.SUCCESS, {}, context.log_stream_name)
              return {"statusCode": 200}
          
          def clean_s3_bucket(bucket_name):
              try:
                  s3 = boto3.resource('s3')
                  bucket = s3.Bucket(bucket_name)
                  bucket.objects.all().delete()
                  bucket.delete()
                  print(f"S3 bucket {bucket_name} deleted successfully")
              except Exception as e:
                  print(f"S3 bucket {bucket_name} does not exist or error: {e}")

  CodeBuildProject:
    Type: AWS::CodeBuild::Project
    DependsOn: [HelperLambdaInvoke]
    Properties:
      Name: !Sub 
        - '${AgentCoreMCPServerName}-codebuild-${StackId}'
        - StackId: !Select [4, !Split ['-', !Select [2, !Split ['/', !Ref 'AWS::StackId']]]]
      ServiceRole: !GetAtt CodeBuildServiceRole.Arn
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        Type: ARM_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux2-aarch64-standard:3.0
        PrivilegedMode: true
      Source:
        Type: S3
        Location: !Sub 
          - '${S3Bucket}/opensearch-agentcore-mcp-server.zip'
          - S3Bucket: !Sub 
            - 'agentcore-mcp-${AWS::AccountId}-${StackId}'
            - StackId: !Select [4, !Split ['-', !Select [2, !Split ['/', !Ref 'AWS::StackId']]]]
        BuildSpec: |
          version: 0.2
          phases:
            install:
              runtime-versions:
                python: 3.12
              commands:
                - echo "Installing bedrock-agentcore-starter-toolkit..."
                - pip install bedrock-agentcore-starter-toolkit
                - echo "Installation complete"
            pre_build:
              commands:
                - echo "Pre-build phase - checking environment..."
                - aws --version
                - python --version
                - ls -la
                - echo "Environment variables:"
                - env | grep -E "(AWS_|CODEBUILD_)"
                - echo f"Checking marketplace subscriptions..."
                - aws marketplace view-subscriptions --region ${AWS::Region} || echo "No subscriptions found"
            build:
              commands:
                - echo "Starting build phase..."
                - echo "Running codebuild_launch.py..."
                - python codebuild_launch.py
            post_build:
              commands:
                - echo "Build completed"

  HelperLambdaInvoke:
    Type: Custom::InvokeLambda
    Properties:
      ServiceToken: !GetAtt HelperLambdaFunction.Arn
      SourceUrl: "https://d2wvpdb2jzk602.cloudfront.net/opensearch-agentcore-mcp-server.zip"
      S3Bucket: !Sub 
        - 'agentcore-mcp-${AWS::AccountId}-${StackId}'
        - StackId: !Select [4, !Split ['-', !Select [2, !Split ['/', !Ref 'AWS::StackId']]]]
      S3Key: opensearch-agentcore-mcp-server.zip
      CleanupS3Bucket: false

  AgentCoreLambdaFunction:
    Type: AWS::Lambda::Function
    DependsOn: [HelperLambdaInvoke]
    Properties:
      FunctionName: !Sub 
        - '${AgentCoreMCPServerName}-${StackId}'
        - StackId: !Select [4, !Split ['-', !Select [2, !Split ['/', !Ref 'AWS::StackId']]]]
      Runtime: python3.12
      Handler: lambda_function.lambda_handler
      Role: !GetAtt AgentCoreLambdaRole.Arn
      Timeout: 300
      Architectures:
        - arm64
      LoggingConfig:
        ApplicationLogLevel: INFO
        LogFormat: JSON
      Code:
        S3Bucket: !Sub 
          - 'agentcore-mcp-${AWS::AccountId}-${StackId}'
          - StackId: !Select [4, !Split ['-', !Select [2, !Split ['/', !Ref 'AWS::StackId']]]]
        S3Key: opensearch-agentcore-mcp-server.zip
      Environment:
        Variables:
          AGENT_NAME: !Sub 
            - '${AgentCoreMCPServerName}_${StackId}'
            - StackId: !Select [4, !Split ['-', !Select [2, !Split ['/', !Ref 'AWS::StackId']]]]
          EXECUTION_ROLE: !If
            - CreateExecutionRole
            - !GetAtt AgentExecutionRole.Arn
            - !Ref ExecutionRole
          ECR_REPOSITORY: !If
            - CreateECRRepository
            - !GetAtt AgentECRRepository.RepositoryUri
            - !Ref ECRRepository
          OPENSEARCH_URL: !If
            - UseImportedOpenSearchEndpoint
            - !Sub 
              - "https://${OpenSearchEndpoint}"
              - OpenSearchEndpoint: !ImportValue 
                  Fn::Sub: "${MultimodalStackName}-OpenSearchDomainEndpoint"
            - !Ref AmazonOpenSearchEndpoint
          DISCOVERY_URL: !If
            - CreateCognito
            - !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${CognitoUserPool}/.well-known/openid-configuration'
            - !Ref OAuthDiscoveryURL
          ALLOWED_CLIENTS: !If
            - CreateCognito
            - !Ref CognitoUserPoolClient
            - !Join [',', !Ref OAuthAllowedClients]
          ALLOWED_AUDIENCE: !Join [',', !Ref OAuthAllowedAudience]
          CODEBUILD_PROJECT: !Ref CodeBuildProject
          AGENTCORE_REGION: !Ref AWS::Region
          OPENSEARCH_REGION: !If
            - UseImportedOpenSearchRegion
            - !ImportValue 
                Fn::Sub: "${MultimodalStackName}-Region"
            - !Ref AmazonOpenSearchRegion

  AgentCoreSetup:
    Type: AWS::CloudFormation::CustomResource
    DependsOn: [AgentCoreLambdaFunction]
    Properties:
      ServiceToken: !GetAtt AgentCoreLambdaFunction.Arn
      AgentName: !Ref AgentCoreMCPServerName
      ExecutionRole: !If
        - CreateExecutionRole
        - !GetAtt AgentExecutionRole.Arn
        - !Ref ExecutionRole
      ECRRepository: !If
        - CreateECRRepository
        - !GetAtt AgentECRRepository.RepositoryUri
        - !Ref ECRRepository
      OpenSearchUrl: !If
        - UseImportedOpenSearchEndpoint
        - !Sub 
          - "https://${OpenSearchEndpoint}"
          - OpenSearchEndpoint: !ImportValue 
              Fn::Sub: "${MultimodalStackName}-OpenSearchDomainEndpoint"
        - !Ref AmazonOpenSearchEndpoint
      DiscoveryUrl: !If
        - CreateCognito
        - !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${CognitoUserPool}/.well-known/openid-configuration'
        - !Ref OAuthDiscoveryURL
      AllowedClients: !If
        - CreateCognito
        - !Ref CognitoUserPoolClient
        - !Join [',', !Ref OAuthAllowedClients]
      AllowedAudience: !Join [',', !Ref OAuthAllowedAudience]

  CleanupS3Bucket:
    Type: Custom::InvokeLambda
    DependsOn: [AgentCoreSetup]
    Properties:
      ServiceToken: !GetAtt HelperLambdaFunction.Arn
      CleanupS3Bucket: true
      S3Bucket: !Sub 
        - 'agentcore-mcp-${AWS::AccountId}-${StackId}'
        - StackId: !Select [4, !Split ['-', !Select [2, !Split ['/', !Ref 'AWS::StackId']]]]

Outputs:
  AgentExecutionRoleArn:
    Description: ARN of the Agent Execution Role
    Value: !If
      - CreateExecutionRole
      - !GetAtt AgentExecutionRole.Arn
      - !Ref ExecutionRole
  
  AgentCoreArn:
    Description: ARN of the created agent.
    Value: !GetAtt AgentCoreSetup.AgentCoreArn
  
  MCPServerEndpoint:
    Description: MCP server URL for the agent.
    Value: !GetAtt AgentCoreSetup.McpUrl
  
  TokenEndpoint:
    Description: |
      OAuth token endpoint. Example cURL command to get token: curl --http1.1 -X POST <TOKEN_ENDPOINT> -H "Content-Type: application/x-www-form-urlencoded" -d "grant_type=client_credentials&client_id=<CLIENT_ID>&client_secret=<CLIENT_SECRET>"
    Value: !GetAtt AgentCoreSetup.TokenEndpoint

  CognitoSecret:
    Condition: CreateCognito
    Description: Name of the Cognito secret in Secrets Manager containing client ID and secret
    Value: !Ref CognitoSecret