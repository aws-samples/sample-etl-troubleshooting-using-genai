version: 2.0

# BEGIN Locale
defaultLocaleCode: en-US
localeCodes:
  - en-US
# END Locale

params:
  hello: world
  foo:
    - bar

# START Infrastructure
infrastructure:
  cloudformationTemplates:
    - templateLocation: assets/cfn/opensearch_cfn.yaml
      label: Vector Search with RAG using OpenSearch
      participantAllStackOutputsVisible: true
      parameters:
        # magic vars
        - templateParameter: OpenSearchUsername
          defaultValue: "admin"
        # No defaultValue: participants are prompted to enter a password at deploy time.
        - templateParameter: OpenSearchPassword
    - templateLocation: assets/cfn/agentcore-mcp-server.yaml
      label: OpenSearch MCP Server
      participantAllStackOutputsVisible: true
    - templateLocation: assets/cfn/etl.yaml
      label: Observability ETL Pipeline
      participantAllStackOutputsVisible: true
    
# END Infrastructure

# START Accounts
awsAccountConfig:
  accountSources:
    - WorkshopStudio
  serviceLinkedRoles:
    - appsync.amazonaws.com
    - bedrock-agentcore.amazonaws.com
  participantRole:
    managedPolicies:
      - "arn:aws:iam::aws:policy/IAMReadOnlyAccess"
    iamPolicies:
      - "assets/cfn/teampolicy.json"
    trustedPrincipals:
      service:
        - ec2.amazonaws.com
        - lambda.amazonaws.com
  regionConfiguration:
    minAccessibleRegions: 1
    maxAccessibleRegions: 3
    accessibleRegions:
      recommended:
        - us-west-2
        - us-east-1
        - us-east-2
    deployableRegions:
      recommended:
        - us-west-2
        - us-east-1
# END Accounts