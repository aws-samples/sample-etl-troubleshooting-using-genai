AWSTemplateFormatVersion: '2010-09-09'
Description: >
  MWAA ETL Pipeline Observability Stack — deploys all infrastructure for the
  MWAA + OpenSearch monitoring solution including OpenSearch domain, SNS topic,
  Secrets Manager secret, S3 bucket, IAM roles, Glue job, Lambda function,
  and SageMaker notebook.

# ---------------------------------------------------------------------------
# Parameters
# ---------------------------------------------------------------------------
Parameters:

  EnvironmentName:
    Type: String
    Default: etl-monitoring
    Description: Base name used for all resources

  OpenSearchInstanceType:
    Type: String
    Default: t3.medium.search
    AllowedValues: [t3.small.search, t3.medium.search, m6g.large.search]
    Description: OpenSearch instance type

  OpenSearchVolumeSize:
    Type: Number
    Default: 20
    MinValue: 10
    MaxValue: 100
    Description: OpenSearch EBS volume size in GB

  MWAAEnvironmentClass:
    Type: String
    Default: mw1.small
    AllowedValues: [mw1.small, mw1.medium, mw1.large]
    Description: MWAA environment class

  MWAAMaxWorkers:
    Type: Number
    Default: 2
    MinValue: 1
    MaxValue: 10

  MWAAMinWorkers:
    Type: Number
    Default: 1
    MinValue: 1

  AirflowVersion:
    Type: String
    Default: "2.9.2"

  NotificationEmail:
    Type: String
    Default: ""
    Description: Email address for SNS failure notifications (optional)

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC ID for MWAA and EC2 (must have internet access via NAT Gateway)

  PrivateSubnet1:
    Type: AWS::EC2::Subnet::Id
    Description: First private subnet for MWAA (must be in different AZ from Subnet2)

  PrivateSubnet2:
    Type: AWS::EC2::Subnet::Id
    Description: Second private subnet for MWAA (must be in different AZ from Subnet1)

  PublicSubnet1:
    Type: AWS::EC2::Subnet::Id
    Description: Public subnet for EC2 instance

  EC2AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Amazon Linux 2023 AMI (auto-resolved from SSM)

  GlueScriptS3Path:
    Type: String
    Description: S3 path to the Glue job script, e.g. s3://my-bucket/glue/etl_glue_job.py

# ---------------------------------------------------------------------------
# Conditions
# ---------------------------------------------------------------------------
Conditions:
  HasNotificationEmail: !Not [!Equals [!Ref NotificationEmail, ""]]

# ---------------------------------------------------------------------------
# Resources
# ---------------------------------------------------------------------------
Resources:

  # -------------------------------------------------------------------------
  # S3 Bucket (MWAA DAGs, Glue scripts, notebooks)
  # -------------------------------------------------------------------------
  ETLBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${EnvironmentName}-${AWS::AccountId}"
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Project
          Value: !Ref EnvironmentName

  # -------------------------------------------------------------------------
  # SNS Topic for failure notifications
  # -------------------------------------------------------------------------
  FailureNotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${EnvironmentName}-failures"
      Tags:
        - Key: Project
          Value: !Ref EnvironmentName

  EmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasNotificationEmail
    Properties:
      TopicArn: !Ref FailureNotificationTopic
      Protocol: email
      Endpoint: !Ref NotificationEmail

  # -------------------------------------------------------------------------
  # Secrets Manager — OpenSearch endpoint
  # -------------------------------------------------------------------------
  OpenSearchEndpointSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${EnvironmentName}/opensearch/endpoint"
      Description: OpenSearch domain endpoint for ETL log shipping
      SecretString: !Sub '{"opensearch_endpoint": "PLACEHOLDER_UPDATED_AFTER_DOMAIN_CREATION"}'
      Tags:
        - Key: Project
          Value: !Ref EnvironmentName

  # -------------------------------------------------------------------------
  # Security Group for OpenSearch and MWAA
  # -------------------------------------------------------------------------
  ETLSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for ETL pipeline components
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-sg"

  # -------------------------------------------------------------------------
  # OpenSearch Domain
  # -------------------------------------------------------------------------
  OpenSearchDomain:
    Type: AWS::OpenSearchService::Domain
    Properties:
      DomainName: !Ref EnvironmentName
      EngineVersion: OpenSearch_2.11
      ClusterConfig:
        InstanceType: !Ref OpenSearchInstanceType
        InstanceCount: 1
        DedicatedMasterEnabled: false
        ZoneAwarenessEnabled: false
      EBSOptions:
        EBSEnabled: true
        VolumeType: gp3
        VolumeSize: !Ref OpenSearchVolumeSize
      NodeToNodeEncryptionOptions:
        Enabled: true
      EncryptionAtRestOptions:
        Enabled: true
      DomainEndpointOptions:
        EnforceHTTPS: true
        TLSSecurityPolicy: Policy-Min-TLS-1-2-2019-07
      AdvancedSecurityOptions:
        Enabled: false
      AccessPolicies:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: "es:*"
            Resource: !Sub "arn:aws:es:${AWS::Region}:${AWS::AccountId}:domain/${EnvironmentName}/*"
      Tags:
        - Key: Project
          Value: !Ref EnvironmentName

  # -------------------------------------------------------------------------
  # IAM Roles
  # -------------------------------------------------------------------------

  # MWAA Execution Role
  MWAAExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EnvironmentName}-MWAAExecutionRole"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - airflow.amazonaws.com
                - airflow-env.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: MWAAExecutionPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: airflow:PublishMetrics
                Resource: !Sub "arn:aws:airflow:${AWS::Region}:${AWS::AccountId}:environment/${EnvironmentName}-mwaa"
              - Effect: Allow
                Action: [s3:GetObject*, s3:GetBucket*, s3:List*]
                Resource:
                  - !GetAtt ETLBucket.Arn
                  - !Sub "${ETLBucket.Arn}/*"
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:CreateLogGroup, logs:PutLogEvents,
                         logs:GetLogEvents, logs:GetLogRecord, logs:GetLogGroupFields,
                         logs:GetQueryResults, logs:DescribeLogGroups]
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:airflow-${EnvironmentName}-mwaa-*"
              - Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: "*"
              - Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: "*"
              - Effect: Allow
                Action: [sqs:ChangeMessageVisibility, sqs:DeleteMessage, sqs:GetQueueAttributes,
                         sqs:GetQueueUrl, sqs:ReceiveMessage, sqs:SendMessage]
                Resource: !Sub "arn:aws:sqs:${AWS::Region}:*:airflow-celery-*"
              - Effect: Allow
                Action: es:ESHttpPost
                Resource: !Sub "${OpenSearchDomain.Arn}/etl-logs-*"
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref OpenSearchEndpointSecret
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref FailureNotificationTopic
              - Effect: Allow
                Action: [glue:GetJob, glue:GetJobRun, glue:StartJobRun, glue:BatchStopJobRun]
                Resource: !Sub "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:job/${EnvironmentName}-extraction-job"
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt ETLTransformFunction.Arn
              - Effect: Allow
                Action: [ssm:SendCommand, ssm:GetCommandInvocation,
                         ssm:ListCommands, ssm:ListCommandInvocations]
                Resource:
                  - !Sub "arn:aws:ssm:${AWS::Region}::document/AWS-RunShellScript"
                  - !Sub "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/${EC2Instance}"
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:*"

  # Glue Service Role
  GlueServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EnvironmentName}-GlueServiceRole"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: glue.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSGlueServiceRole
      Policies:
        - PolicyName: GlueOpenSearchS3Policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: es:ESHttpPost
                Resource: !Sub "${OpenSearchDomain.Arn}/etl-logs-*"
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:ListBucket]
                Resource:
                  - !GetAtt ETLBucket.Arn
                  - !Sub "${ETLBucket.Arn}/*"

  # Lambda Execution Role
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EnvironmentName}-LambdaExecutionRole"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: LambdaOpenSearchPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: es:ESHttpPost
                Resource: !Sub "${OpenSearchDomain.Arn}/etl-logs-*"
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref OpenSearchEndpointSecret

  # EC2 Instance Role
  EC2InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EnvironmentName}-EC2InstanceRole"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: EC2OpenSearchS3Policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: es:ESHttpPost
                Resource: !Sub "${OpenSearchDomain.Arn}/etl-logs-*"
              - Effect: Allow
                Action: [s3:GetObject, s3:ListBucket]
                Resource:
                  - !GetAtt ETLBucket.Arn
                  - !Sub "${ETLBucket.Arn}/*"

  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub "${EnvironmentName}-EC2InstanceProfile"
      Roles:
        - !Ref EC2InstanceRole

  # OpenSearch Alerting Role
  OpenSearchAlertingRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EnvironmentName}-OpenSearchAlertingRole"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: es.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: SNSPublishPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref FailureNotificationTopic

  # SageMaker Notebook Role
  SageMakerNotebookRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EnvironmentName}-SageMakerNotebookRole"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: sagemaker.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSageMakerFullAccess
      Policies:
        - PolicyName: NotebookOpenSearchBedrockPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [es:ESHttpGet, es:ESHttpPost, es:ESHttpPut]
                Resource: !Sub "${OpenSearchDomain.Arn}/*"
              - Effect: Allow
                Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
                Resource: !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/anthropic.claude-3-haiku-20240307-v1:0"

  # -------------------------------------------------------------------------
  # Lambda Function (ETL Transform)
  # -------------------------------------------------------------------------
  ETLTransformFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${EnvironmentName}-transform"
      Runtime: python3.11
      Handler: handler.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 60
      MemorySize: 256
      Environment:
        Variables:
          OPENSEARCH_ENDPOINT: !Sub "https://${OpenSearchDomain.DomainEndpoint}"
          OPENSEARCH_INDEX: !Sub "etl-logs-2026-04"
      Code:
        ZipFile: |
          import json, logging, os
          from datetime import datetime, timezone
          log = logging.getLogger(__name__)
          logging.basicConfig(level=logging.INFO)
          def handler(event, context):
              run_id = event.get("run_id", "unknown")
              log.info("Lambda invoked: run_id=%s", run_id)
              return {"statusCode": 200, "body": "success"}
      Tags:
        - Key: Project
          Value: !Ref EnvironmentName

  # -------------------------------------------------------------------------
  # Glue Job (ETL Extraction)
  # -------------------------------------------------------------------------
  ETLExtractionJob:
    Type: AWS::Glue::Job
    Properties:
      Name: !Sub "${EnvironmentName}-extraction-job"
      Role: !GetAtt GlueServiceRole.Arn
      Command:
        Name: pythonshell
        ScriptLocation: !Ref GlueScriptS3Path
        PythonVersion: "3"
      DefaultArguments:
        "--job-language": python
        "--additional-python-modules": "requests==2.31.0,requests-aws4auth==1.3.1"
        "--OPENSEARCH_ENDPOINT": !Sub "https://${OpenSearchDomain.DomainEndpoint}"
        "--OPENSEARCH_INDEX": "etl-logs-2026-04"
      MaxCapacity: 0.0625
      Tags:
        Project: !Ref EnvironmentName

  # -------------------------------------------------------------------------
  # EC2 Instance (Custom Script)
  # -------------------------------------------------------------------------
  EC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref EC2AmiId
      InstanceType: t3.micro
      IamInstanceProfile: !Ref EC2InstanceProfile
      SubnetId: !Ref PublicSubnet1
      SecurityGroupIds:
        - !Ref ETLSecurityGroup
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          yum update -y
          yum install -y python3-pip
          pip3 install requests requests-aws4auth boto3
          mkdir -p /opt/etl/plugins/log_shipper
          touch /opt/etl/plugins/__init__.py
          touch /opt/etl/plugins/log_shipper/__init__.py
          aws s3 cp s3://${ETLBucket}/ec2/custom_script.py /opt/etl/custom_script.py
          aws s3 cp s3://${ETLBucket}/ec2/plugins/log_shipper/models.py /opt/etl/plugins/log_shipper/models.py
          aws s3 cp s3://${ETLBucket}/ec2/plugins/log_shipper/log_shipper.py /opt/etl/plugins/log_shipper/log_shipper.py
          aws s3 cp s3://${ETLBucket}/ec2/plugins/log_shipper/exceptions.py /opt/etl/plugins/log_shipper/exceptions.py
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-custom-script"
        - Key: Project
          Value: !Ref EnvironmentName

  # -------------------------------------------------------------------------
  # MWAA Environment
  # -------------------------------------------------------------------------
  MWAAEnvironment:
    Type: AWS::MWAA::Environment
    DependsOn:
      - OpenSearchDomain
      - ETLBucket
      - MWAAExecutionRole
    Properties:
      Name: !Sub "${EnvironmentName}-mwaa"
      AirflowVersion: !Ref AirflowVersion
      ExecutionRoleArn: !GetAtt MWAAExecutionRole.Arn
      SourceBucketArn: !GetAtt ETLBucket.Arn
      DagS3Path: dags/
      RequirementsS3Path: requirements.txt
      EnvironmentClass: !Ref MWAAEnvironmentClass
      MaxWorkers: !Ref MWAAMaxWorkers
      MinWorkers: !Ref MWAAMinWorkers
      WebserverAccessMode: PUBLIC_ONLY
      NetworkConfiguration:
        SubnetIds:
          - !Ref PrivateSubnet1
          - !Ref PrivateSubnet2
        SecurityGroupIds:
          - !Ref ETLSecurityGroup
      LoggingConfiguration:
        DagProcessingLogs:
          Enabled: true
          LogLevel: INFO
        SchedulerLogs:
          Enabled: true
          LogLevel: INFO
        TaskLogs:
          Enabled: true
          LogLevel: INFO
        WebserverLogs:
          Enabled: true
          LogLevel: INFO
        WorkerLogs:
          Enabled: true
          LogLevel: INFO
      Tags:
        Project: !Ref EnvironmentName

  # -------------------------------------------------------------------------
  # SageMaker Notebook Instance
  # -------------------------------------------------------------------------
  SageMakerNotebook:
    Type: AWS::SageMaker::NotebookInstance
    Properties:
      NotebookInstanceName: !Sub "${EnvironmentName}-log-analysis"
      InstanceType: ml.t3.medium
      RoleArn: !GetAtt SageMakerNotebookRole.Arn
      Tags:
        - Key: Project
          Value: !Ref EnvironmentName

# ---------------------------------------------------------------------------
# Outputs
# ---------------------------------------------------------------------------
Outputs:

  OpenSearchEndpoint:
    Description: OpenSearch domain endpoint
    Value: !Sub "https://${OpenSearchDomain.DomainEndpoint}"
    Export:
      Name: !Sub "${EnvironmentName}-OpenSearchEndpoint"

  OpenSearchDashboardsUrl:
    Description: OpenSearch Dashboards URL
    Value: !Sub "https://${OpenSearchDomain.DomainEndpoint}/_dashboards"

  S3BucketName:
    Description: S3 bucket for MWAA DAGs and scripts
    Value: !Ref ETLBucket
    Export:
      Name: !Sub "${EnvironmentName}-S3Bucket"

  SNSTopicArn:
    Description: SNS topic ARN for failure notifications
    Value: !Ref FailureNotificationTopic
    Export:
      Name: !Sub "${EnvironmentName}-SNSTopicArn"

  SecretsManagerSecretArn:
    Description: Secrets Manager secret ARN for OpenSearch endpoint
    Value: !Ref OpenSearchEndpointSecret
    Export:
      Name: !Sub "${EnvironmentName}-OpenSearchSecretArn"

  MWAAEnvironmentName:
    Description: MWAA environment name
    Value: !Sub "${EnvironmentName}-mwaa"

  LambdaFunctionArn:
    Description: ETL transform Lambda function ARN
    Value: !GetAtt ETLTransformFunction.Arn

  GlueJobName:
    Description: Glue extraction job name
    Value: !Ref ETLExtractionJob

  EC2InstanceId:
    Description: EC2 instance ID for custom script
    Value: !Ref EC2Instance

  SageMakerNotebookUrl:
    Description: SageMaker notebook instance URL
    Value: !Sub "https://${EnvironmentName}-log-analysis.notebook.${AWS::Region}.sagemaker.aws"

  MWAAExecutionRoleArn:
    Description: MWAA execution role ARN
    Value: !GetAtt MWAAExecutionRole.Arn

  PostDeploymentSteps:
    Description: Steps to complete after stack creation
    Value: !Sub |
      1. Update the OpenSearch endpoint secret: aws secretsmanager update-secret --secret-id ${OpenSearchEndpointSecret} --secret-string '{"opensearch_endpoint":"https://${OpenSearchDomain.DomainEndpoint}"}'
      2. Upload DAG files to s3://${ETLBucket}/dags/
      3. Upload requirements.txt to s3://${ETLBucket}/requirements.txt
      4. Set Airflow Variables in the MWAA UI (opensearch_secret_name, opensearch_index_name, aws_region, sns_failure_topic_arn, glue_job_name, lambda_function_name, ec2_instance_id)
      5. Create the OpenSearch index: awscurl --service es --region ${AWS::Region} -X PUT -H "Content-Type: application/json" -d @blog/config/index_mapping.json "https://${OpenSearchDomain.DomainEndpoint}/etl-logs-$(date +%Y-%m)"
      6. Apply the ISM policy: awscurl --service es --region ${AWS::Region} -X PUT -H "Content-Type: application/json" -d @blog/config/ism_policy.json "https://${OpenSearchDomain.DomainEndpoint}/_plugins/_ism/policies/etl-logs-retention"
      7. Upload the SageMaker notebook to s3://${ETLBucket}/notebooks/etl_log_analysis.ipynb
